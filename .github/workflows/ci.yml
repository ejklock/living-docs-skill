name: CI

# Runs the native `living-docs` CLI (Rust): fmt/clippy/test via the pinned Docker dev
# image (Dockerfile.dev, matching cli/rust-toolchain.toml), then `make check` builds
# the release binary and runs the Living Docs invariant + mermaid checks against the
# example corpus plus the hostile fixtures, on every push and PR. A formatting issue,
# lint warning, failing test, invariant violation, or file-size ratchet violation fails
# the build.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Cache cargo registry, git deps and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Version consistency (VERSION ↔ every SKILL.md)
        run: ./scripts/check-version.sh

      - name: File-size ratchet (300-line cap + grandfather baseline)
        run: ./scripts/check-file-size.sh

      - name: cargo fmt --check (cli/, pinned Rust 1.96.0 via Dockerfile.dev)
        run: make cli-fmt

      - name: cargo clippy --all-targets -- -D warnings (cli/)
        run: make cli-clippy

      - name: cargo test (cli/)
        run: make cli-test

      - name: living-docs check — install.sh syntax, docs invariants, mermaid, fixtures
        run: make check
