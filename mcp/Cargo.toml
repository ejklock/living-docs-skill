[package]
name = "living-docs-mcp"
version = "0.28.0"
edition = "2021"
description = "MCP front serving one living-docs bundle over stdio."

[lib]
name = "living_docs_mcp"
path = "src/lib.rs"

[dependencies]
fs-store = { path = "../fs-store" }
living-docs-core = { path = "../living-docs-core" }
rmcp = { version = "3.9", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }

[dev-dependencies]
rmcp = { version = "3.9", features = ["client"] }

[lints]
workspace = true
