[package]
name = "living-docs-mcp"
version = "0.35.0"
edition = "2021"
description = "MCP front serving one living-docs bundle over stdio."

[lib]
name = "living_docs_mcp"
path = "src/lib.rs"

[dependencies]
fs-store = { path = "../fs-store" }
living-docs-core = { path = "../living-docs-core" }
notify-debouncer-mini = "0.8"
percent-encoding = "2"
rmcp = { version = "3.12", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }

[dev-dependencies]
rmcp = { version = "3.12", features = ["client"] }
serde_yaml = "0.9"
sha2 = "0.11"

[lints]
workspace = true
