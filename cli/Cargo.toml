[package]
name = "living-docs"
version = "0.28.0"
edition = "2021"
description = "Deterministic layer of Living Docs authoring (ADR 0001)."

[[bin]]
name = "living-docs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
fs-store = { path = "../fs-store" }
living-docs-core = { path = "../living-docs-core" }
living-docs-mcp = { path = "../mcp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rust-embed = "8"

[lints]
workspace = true
