<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Three read levels: living-docs read lists active records, read --contract adds the contract sections, read --full adds the detail sections. check requires named sections on live records of each type.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#10141c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#8A2BE2"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6e7681"/>
    </marker>
  </defs>

  <rect width="1280" height="620" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#accent)"/>

  <text x="64" y="78" fill="#e6edf3" font-size="40" font-weight="700">Read only what the task needs</text>
  <text x="64" y="112" fill="#8b949e" font-size="19">Each level adds to the one before. Retired records stay out of every level.</text>

  <g stroke="#6e7681" stroke-width="2" fill="none">
    <path d="M432,250 H452" marker-end="url(#arrow)"/>
    <path d="M824,250 H844" marker-end="url(#arrow)"/>
  </g>

  <g>
    <rect x="64" y="152" width="368" height="196" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="88" y="188" fill="#e6edf3" font-size="20" font-weight="600">living-docs read</text>
    <text x="88" y="212" fill="#a371f7" font-size="13" font-weight="600">INDEX · orient</text>
    <g fill="#8b949e" font-size="14">
      <text x="88" y="250">One line per active record:</text>
      <text x="88" y="274">type, number, title, description.</text>
      <text x="88" y="298">Supersede chains collapse to the head.</text>
      <text x="88" y="322">--topic &lt;term&gt; narrows the list.</text>
    </g>
  </g>
  <g>
    <rect x="456" y="152" width="368" height="196" rx="12" fill="#161b22" stroke="#8A2BE2" stroke-width="2"/>
    <text x="480" y="188" fill="#e6edf3" font-size="20" font-weight="600">read --contract</text>
    <text x="480" y="212" fill="#a371f7" font-size="13" font-weight="600">+ CONTRACT SECTIONS · act</text>
    <g fill="#8b949e" font-size="14">
      <text x="480" y="250">issue: Scope · Decision · Acceptance</text>
      <text x="480" y="274">ADR: Context · Decision · Consequences</text>
      <text x="480" y="298">PRD: Problem / Motivation · Non-goals …</text>
      <text x="480" y="322">research: Question · Findings</text>
    </g>
  </g>
  <g>
    <rect x="848" y="152" width="368" height="196" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="872" y="188" fill="#e6edf3" font-size="20" font-weight="600">read --full</text>
    <text x="872" y="212" fill="#a371f7" font-size="13" font-weight="600">+ DETAIL SECTIONS · dig in</text>
    <g fill="#8b949e" font-size="14">
      <text x="872" y="250">issue: Plan · Outcome</text>
      <text x="872" y="274">ADR, research: References</text>
      <text x="872" y="298">PRD: Open questions · Related</text>
      <text x="872" y="322">constitution: Amendment Log</text>
    </g>
  </g>

  <rect x="64" y="384" width="1152" height="196" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="88" y="420" fill="#e6edf3" font-size="20" font-weight="600">Required sections</text>
  <text x="290" y="420" fill="#8b949e" font-size="14">living-docs check fails a live record that lacks one</text>
  <g font-size="15">
    <g fill="#e6edf3" font-weight="600">
      <text x="88" y="458">issue</text>
      <text x="88" y="484">ADR</text>
      <text x="88" y="510">PRD</text>
      <text x="88" y="536">constitution</text>
      <text x="88" y="562">research</text>
    </g>
    <g fill="#8b949e">
      <text x="248" y="458">Scope · Acceptance</text>
      <text x="248" y="484">Context · Decision · Consequences</text>
      <text x="248" y="510">Problem / Motivation · Non-goals</text>
      <text x="248" y="536">Product · Scope Boundaries · Non-negotiables</text>
      <text x="248" y="562">none (its sections are optional)</text>
    </g>
  </g>
</svg>
