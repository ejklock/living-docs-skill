<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Living Docs doc trail: constitution to an optional PRD to ADR to issues to code, with a direct path from constitution to issues for routine changes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#10141c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#8A2BE2"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6e7681"/>
    </marker>
  </defs>

  <rect width="1280" height="440" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#accent)"/>

  <text x="64" y="78" fill="#e6edf3" font-size="40" font-weight="700">The doc trail</text>
  <text x="64" y="112" fill="#8b949e" font-size="19">Only what a change earns appears. A routine change is an issue and code.</text>

  <g stroke="#6e7681" stroke-width="2" fill="none">
    <path d="M260,200 H310" marker-end="url(#arrow)"/>
    <path d="M500,200 H550" marker-end="url(#arrow)"/>
    <path d="M740,200 H790" marker-end="url(#arrow)"/>
    <path d="M980,200 H1030" marker-end="url(#arrow)"/>
    <path d="M162,232 C162,310 888,310 888,240" marker-end="url(#arrow)"/>
  </g>
  <text x="525" y="326" fill="#8b949e" font-size="13" text-anchor="middle">routine change: no PRD, no ADR</text>

  <g>
    <rect x="64" y="168" width="196" height="64" rx="12" fill="#161b22" stroke="#8A2BE2" stroke-width="2"/>
    <text x="162" y="197" fill="#e6edf3" font-size="18" font-weight="600" text-anchor="middle">constitution</text>
    <text x="162" y="218" fill="#8b949e" font-size="12" text-anchor="middle">what never changes</text>
  </g>
  <g>
    <rect x="316" y="168" width="184" height="64" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="408" y="197" fill="#e6edf3" font-size="18" font-weight="600" text-anchor="middle">PRD</text>
    <text x="408" y="218" fill="#8b949e" font-size="12" text-anchor="middle">optional · who asked, success</text>
  </g>
  <g>
    <rect x="556" y="168" width="184" height="64" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="648" y="197" fill="#e6edf3" font-size="18" font-weight="600" text-anchor="middle">ADR</text>
    <text x="648" y="218" fill="#8b949e" font-size="12" text-anchor="middle">a choice expensive to reverse</text>
  </g>
  <g>
    <rect x="796" y="168" width="184" height="64" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="888" y="197" fill="#e6edf3" font-size="18" font-weight="600" text-anchor="middle">issues</text>
    <text x="888" y="218" fill="#8b949e" font-size="12" text-anchor="middle">the change and its done-when</text>
  </g>
  <g>
    <rect x="1036" y="168" width="180" height="64" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="1126" y="197" fill="#e6edf3" font-size="18" font-weight="600" text-anchor="middle">code</text>
    <text x="1126" y="218" fill="#8b949e" font-size="12" text-anchor="middle">shipped</text>
  </g>

  <g font-size="13" fill="#8b949e">
    <rect x="64" y="372" width="150" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
    <text x="139" y="392" text-anchor="middle">OKF-formatted</text>
    <rect x="226" y="372" width="160" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
    <text x="306" y="392" text-anchor="middle">Mermaid diagrams</text>
    <rect x="398" y="372" width="150" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
    <text x="473" y="392" text-anchor="middle">stack-agnostic</text>
    <rect x="560" y="372" width="250" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
    <text x="685" y="392" text-anchor="middle">checked by living-docs check</text>
  </g>
</svg>
